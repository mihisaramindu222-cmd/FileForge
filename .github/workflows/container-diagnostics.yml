name: FileForge container diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          docker version
          node --version
          python3 --version

      - name: Validate Python converter
        run: python3 -m py_compile scripts/pdf_office.py

      - name: Build the exact Vercel container
        run: docker build --progress=plain -f Dockerfile.vercel -t fileforge-vercel-ci:latest .

      - name: Inspect built image
        run: docker image inspect fileforge-vercel-ci:latest --format '{{.Architecture}} {{.Os}} {{.Config.ExposedPorts}} {{.Config.Entrypoint}} {{.Config.Cmd}}'

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fileforge-vercel-smoke -p 18080:80 \
            -e PORT=80 \
            fileforge-vercel-ci:latest
          trap 'docker logs fileforge-vercel-smoke || true; docker rm -f fileforge-vercel-smoke || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18080/ >/tmp/fileforge-home.html; then
              grep -q "FileForge" /tmp/fileforge-home.html
              exit 0
            fi
            sleep 1
          done
          exit 1
